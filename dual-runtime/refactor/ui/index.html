<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AIS2API</title><script>try{const t=localStorage.getItem("ais-theme");document.documentElement.classList.toggle("dark",t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches));}catch{}</script><link rel="stylesheet" href="/console-assets/console.css"><link rel="stylesheet" href="/console-assets/layout.css"><script src="/console-assets/console.js" defer></script><script src="/console-assets/shell.js" defer></script><script src="/console-assets/models.js" defer></script><script src="/console-assets/analytics.js" defer></script><script src="/console-assets/prices.js" defer></script><script src="/console-assets/proxies.js" defer></script></head>
<body>
<svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-3-5"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15v-5M12 15V6M17 15v-8"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
<symbol id="i-model" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7l9-5Zm0 10 9-5M12 12 3 7M12 12v10"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 14 6M4 12a8 8 0 0 0 14 6"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M2 12h4l3-9 6 18 3-9h4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.8 13a9 9 0 0 1-9.8-9.8A9 9 0 1 0 20.8 13Z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
<symbol id="i-columns" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></symbol>
<symbol id="i-dollar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 8.5h-4.5a2 2 0 0 0 0 4H13a2 2 0 0 1 0 4H8.5M12 6v12"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-12h-7l1-8Z"/></symbol>
</defs></svg>
<aside class="sidebar topnav" aria-label="主导航">
 <div class="topnav-inner">
  <a class="brand" href="#overview"><span class="logo" aria-hidden="true"><svg class="icon"><use href="#i-model"/></svg></span><strong>AIS2API</strong></a>
  <nav class="sidebar-nav">
   <a href="#overview" data-page="overview"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span>概览</span></a>
   <a href="#accounts" data-page="accounts"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span>账号</span></a>
   <a href="#usage" data-page="usage"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg><span>统计</span></a>
   <a href="#history" data-page="history"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span>请求</span></a>
   <a href="#models" data-page="models"><svg class="icon" aria-hidden="true"><use href="#i-model"/></svg><span>模型</span></a>
   <a href="#settings" data-page="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span>设置</span></a>
  </nav>
  <div class="topnav-tools"><span id="updated" class="muted">—</span><button id="refresh" class="icon-button ghost" aria-label="刷新" title="刷新"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button><button class="icon-button ghost" type="button" data-theme-toggle aria-label="切换主题" title="切换主题"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button><button id="theme" hidden aria-hidden="true" tabindex="-1"></button><button id="sidebar-toggle" hidden tabindex="-1"><span></span></button></div>
 </div>
</aside>
<div class="mobile-topbar"><a class="mobile-brand" href="#overview"><span class="logo" aria-hidden="true"><svg class="icon"><use href="#i-model"/></svg></span><strong id="page-title">概览</strong></a><button class="icon-button ghost" type="button" data-refresh aria-label="刷新"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button><button class="icon-button ghost" type="button" data-theme-toggle aria-label="切换主题"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button></div>
<main>
<p id="page-description" hidden></p>
<div id="notice" role="status" aria-live="polite" hidden></div>

<section id="overview" class="page">
 <div class="stats kpis">
  <article class="card stat kpi"><span>服务</span><strong id="service">—</strong><small id="service-note"></small></article>
  <article class="card stat kpi"><span>排队</span><strong id="queued">—</strong></article>
  <article class="card stat kpi"><span>处理中</span><strong id="active">—</strong></article>
  <article class="card stat kpi"><span>账号</span><strong id="account-count">—</strong></article>
 </div>
 <div class="section-head"><h2>实例</h2></div>
 <div id="workers" class="workers"><div class="card empty">加载中…</div></div>
</section>

<section id="accounts" class="page" hidden>
 <div class="toolbar-row">
  <div id="account-summary" class="account-summary" aria-label="账号筛选"></div>
  <div class="tools">
   <details class="rotation-panel popover"><summary class="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>轮换</span></summary>
    <div class="popover-body"><label>实例<select id="slot"><option value="A">实例 A</option><option value="B">实例 B</option></select></label><label>目标账号<select id="target"><option value="">自动</option></select></label><button id="rotate" class="primary">轮换</button></div></details>
   <button id="sync"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>同步</span></button>
   <a class="button primary" href="/import"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span>导入账号</span></a>
  </div>
 </div>
 <div class="card table-card">
  <div class="account-toolbar"><label class="search-field"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span class="sr-only">搜索</span><input id="quota-search" type="search" maxlength="200" placeholder="搜索名称或编号"></label><label class="status-select"><span class="sr-only">状态</span><select id="account-status"><option value="all">全部</option><option value="available">备用</option><option value="assigned">使用中</option><option value="cooling">冷却</option><option value="invalid">失效</option></select></label></div>
  <div class="table-wrap"><table class="account-table"><thead><tr><th>账号</th><th>实例</th><th>额度</th><th>状态</th><th>登录</th><th>冷却至</th><th><span class="sr-only">操作</span></th></tr></thead><tbody id="account-rows"><tr><td colspan="7">加载中…</td></tr></tbody></table></div>
  <div class="pager account-pager"><span id="account-page" class="muted"></span><div class="tools"><label><span class="sr-only">每页</span><select id="account-page-size"><option value="20">20 / 页</option><option value="50">50 / 页</option><option value="100">100 / 页</option></select></label><button id="account-prev" disabled>‹</button><button id="account-next" disabled>›</button></div></div>
 </div>
 <dialog id="account-dialog" aria-labelledby="account-dialog-title"><div class="dialog-head"><div><h2 id="account-dialog-title">账号</h2><span id="account-dialog-subtitle" class="muted"></span></div><button id="account-dialog-close" class="icon-button ghost" aria-label="关闭">×</button></div><div class="dialog-body"><div id="quota-accounts" class="quota-accounts"></div></div></dialog>
</section>

<section id="usage" class="page" hidden>
 <div class="toolbar-row"><h2 class="page-h">使用统计</h2><div class="tools usage-toolbar"><span id="usage-message" class="muted" role="status"></span><label><span class="sr-only">范围</span><select id="usage-range"><option value="today">今日</option><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="all">全部</option></select></label><button id="usage-refresh" class="icon-button" aria-label="刷新" title="刷新"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div></div>
 <div id="usage-cards" class="stats"></div>
 <div class="card distribution-card"><div class="section-head"><div class="heading-icon"><h2>模型分布</h2></div></div><div id="usage-models"></div></div>
</section>

<section id="history" class="page" hidden>
 <form id="history-filter" class="filter-bar">
  <label>模型<input id="history-model" maxlength="200" placeholder="全部" autocomplete="off"></label>
  <label>账号<input id="history-account" type="number" min="0" step="1" placeholder="全部"></label>
  <label>结果<select id="history-outcome"><option value="">全部</option><option value="success">成功</option><option value="http_error">HTTP 错误</option><option value="application_error">应用错误</option><option value="cancelled">已取消</option><option value="uncertain">待核实</option><option value="pending">进行中</option></select></label>
  <div class="history-actions"><button type="submit" class="primary">筛选</button><button id="history-refresh" type="button" class="icon-button" aria-label="刷新" title="刷新"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div>
 </form>
 <p id="history-message" class="muted" role="status"></p>
 <div id="history-list" class="history-list"></div>
 <div class="pager"><button id="history-prev" disabled>‹</button><span id="history-page"></span><button id="history-next" disabled>›</button></div>
</section>

<section id="models" class="page" hidden>
 <div class="models-top">
  <div id="catalog-workers" class="workers catalog-grid"></div>
  <div class="card form-card policy-card"><div class="section-head"><h2>额度规则</h2><span id="policy-message" class="muted" role="status"></span></div>
   <label>模型<select id="policy-model"><option value="">先刷新目录</option></select></label>
   <label>类别<select id="policy-bucket"><option value="">请选择</option><option value="flash">Flash · 100 次</option><option value="pro">Pro · 10 次</option></select></label>
   <div class="form-foot"><label><input id="policy-anti" type="checkbox">防截断续传</label><button id="policy-save" class="primary" disabled>保存</button></div>
  </div>
 </div>
 <div class="card table-card">
  <div class="account-toolbar"><h2>模型</h2><span id="catalog-message" class="muted" role="status"></span><label class="search-field"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span class="sr-only">筛选</span><input id="catalog-search" type="search" placeholder="筛选模型" maxlength="200"></label><button id="catalog-read" class="icon-button" aria-label="刷新目录" title="刷新目录"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div>
  <div class="table-wrap"><table><thead><tr><th>模型</th><th>来源</th><th>能力</th><th>更新</th></tr></thead><tbody id="catalog-rows"></tbody></table></div>
 </div>
</section>

<section id="settings" class="page" hidden>
 <div class="settings-grid">
  <div class="card form-card proxy-card"><div class="section-head"><h2>SOCKS5 代理</h2><button type="button" id="proxy-read" class="icon-button" aria-label="重新读取" title="重新读取"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div><p id="proxy-message" role="status"></p><div id="proxy-forms" class="proxy-forms"></div></div>
  <div class="settings-side">
   <div class="card form-card"><div class="section-head"><h2>流式模式</h2><span id="mode-current" class="badge">—</span></div><div class="inline-form"><select id="mode" aria-label="流式模式"><option value="fake">Fake · 缓冲</option><option value="real">Real · 流式</option></select><button id="save-mode" class="primary">应用</button></div></div>
   <div class="card form-card"><div class="section-head"><h2>单价 <small>USD / 百万 Token</small></h2><button id="price-read" type="button" class="icon-button" aria-label="重新读取" title="重新读取"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div>
    <p id="price-message" role="status"></p>
    <form id="price-form" class="price-form">
     <label class="span2">模型<select id="price-model" required><option value="">加载中</option></select></label>
     <label>输入<input id="price-input" type="number" min="0" max="1000000" step="any" placeholder="未知"></label>
     <label>输出<input id="price-output" type="number" min="0" max="1000000" step="any" placeholder="未知"></label>
     <label>缓存输入<input id="price-cached" type="number" min="0" max="1000000" step="any" placeholder="未知"></label>
     <label>思考<input id="price-reasoning" type="number" min="0" max="1000000" step="any" placeholder="未知"></label>
     <label class="span2">思考计价<select id="price-reasoning-mode"><option value="unknown">未知</option><option value="separate">单独计价</option><option value="included">含在输出内</option></select></label>
     <button id="price-save" type="submit" class="primary span2" disabled>保存</button>
    </form></div>
  </div>
 </div>
</section>
</main>
<nav class="mobile-nav" aria-label="手机导航">
 <a href="#overview" data-page="overview"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span>概览</span></a>
 <a href="#accounts" data-page="accounts"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span>账号</span></a>
 <a href="#usage" data-page="usage"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg><span>统计</span></a>
 <a href="#settings" data-page="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span>设置</span></a>
 <button id="mobile-more" type="button" data-more-open aria-haspopup="dialog" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg><span>更多</span></button>
</nav>
<dialog id="more-menu" class="more-sheet" aria-labelledby="more-title">
 <div class="sheet-handle" aria-hidden="true"></div>
 <div class="sheet-heading"><h2 id="more-title">更多</h2><button id="more-close" class="icon-button ghost" type="button" aria-label="关闭"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
 <div class="sheet-grid">
  <a href="#models" data-page="models"><span class="sheet-icon"><svg class="icon" aria-hidden="true"><use href="#i-model"/></svg></span><span>模型</span></a>
  <a href="#history" data-page="history"><span class="sheet-icon"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg></span><span>请求</span></a>
  <a href="/import"><span class="sheet-icon"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg></span><span>导入</span></a>
 </div>
</dialog>
</body></html>
