<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · AIS2API</title><link rel="icon" type="image/png" href="/public-assets/nai-favicon.png">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#11141b" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f5f6f8;--fg:#1b2030;--panel:#fff;--muted:#5e6675;--border:#e2e5ea;--primary:#26457e;--on:#fff;--danger:#c2413b;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#11141b;--fg:#e4e7ee;--panel:#181c25;--muted:#9097a6;--border:#272d39;--primary:#93acdc;--on:#0f1420;--danger:#e0716b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif}
.panel{width:min(360px,100%);padding:28px 26px 24px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.2px}
.sub{margin:2px 0 22px;color:var(--muted);font-size:13px}
label{display:block;margin-bottom:6px;font-size:13px;font-weight:600}
input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--fg);font:inherit}
input::placeholder{color:var(--muted)}
input:focus-visible{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
button{width:100%;min-height:44px;margin-top:16px;border:0;border-radius:6px;background:var(--primary);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
button:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.error{margin:12px 0 0;padding:8px 12px;border-left:3px solid var(--danger);border-radius:6px;background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);font-size:13px}
</style></head><body>
<form class="panel" action="/login" method="post">
<h1>AIS2API</h1><p class="sub">管理后台</p>
<label for="k">密码</label>
<input id="k" type="password" name="apiKey" placeholder="未设置密码时填 API Key" autocomplete="current-password" required autofocus>
<!--ERROR-->
<button type="submit">登录</button>
</form></body></html>
