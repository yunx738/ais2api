[package]
name = "coordinator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "process", "io-util"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
regex = "1"
once_cell = "1"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }
base64 = "0.22"
hex = "0.4"
url = "2"
libc = "0.2"
memchr = "2"
aes-gcm = "0.10"
hmac-sha1-dep = { package = "sha1", version = "0.10" }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
httpdate = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
